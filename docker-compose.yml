
services:
  db:
    image: postgres:15-alpine
    container_name: avaliadorProfessores
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: avaliador_de_professores_db
    ports:
      - "5456:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: